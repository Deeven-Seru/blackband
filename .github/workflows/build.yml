name: Build and Test AgentC

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 17
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo apt-get install -y llvm-17 llvm-17-dev clang-17
          sudo ln -sf /usr/bin/llvm-config-17 /usr/bin/llvm-config

      - name: Install CMake and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          mkdir -p agentc/build
          cd agentc/build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build compiler
        run: |
          cd agentc/build
          ninja -j$(nproc)

      - name: Run unit tests
        run: |
          cd agentc/build
          ctest --output-on-failure

      - name: Compile example programs
        run: |
          cd agentc/build
          echo "[COMPILE] Running test suite..."
          bash ../../test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: agentc/build/test_results.txt
          if-no-files-found: warn
